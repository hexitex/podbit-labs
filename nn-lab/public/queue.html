<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Queue</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 16px; font-size: 14px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: #fff; display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: #22c55e; }
  .dot.err { background: #ef4444; }
  .dot.connecting { background: #f59e0b; }
  .stats { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; color: #888; }
  .stats span { background: #161616; padding: 4px 10px; border-radius: 4px; }
  .tabs { display: flex; gap: 2px; margin-bottom: 12px; }
  .tab { padding: 6px 14px; background: #161616; border: none; color: #888; cursor: pointer; font-size: 12px; border-radius: 4px 4px 0 0; }
  .tab.active { background: #1e1e1e; color: #fff; }
  table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 6px; overflow: hidden; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2a2a; }
  td { padding: 8px 12px; border-bottom: 1px solid #1a1a1a; font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr.job-row:hover { background: #252525; }
  .status { padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .status.queued { background: #1e3a5f; color: #60a5fa; }
  .status.running { background: #1a3a1a; color: #4ade80; }
  .status.completed { background: #1a2e1a; color: #22c55e; }
  .status.failed { background: #3a1a1a; color: #f87171; }
  .btn { padding: 4px 10px; border: 1px solid #333; background: #1a1a1a; color: #ccc; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn:hover { background: #2a2a2a; border-color: #555; }
  .btn.danger { border-color: #7f1d1d; color: #f87171; }
  .btn.danger:hover { background: #2a1010; }
  .hypothesis { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #aaa; }
  .spec-type { color: #a78bfa; font-family: monospace; font-size: 12px; }
  .job-id { font-family: monospace; font-size: 11px; color: #666; }
  .time { color: #666; font-size: 12px; }
  .empty { text-align: center; padding: 32px; color: #444; }
  .refresh { font-size: 11px; color: #444; cursor: pointer; margin-left: auto; }
  .refresh:hover { color: #888; }
  .actions { display: flex; gap: 4px; }
  .error-summary { color: #f87171; font-size: 12px; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .error-summary:hover { color: #fca5a5; }
  .trace-row td { padding: 0; border-bottom: 1px solid #1a1a1a; }
  .trace-panel { background: #111; border-left: 3px solid #7f1d1d; margin: 0; overflow: hidden; transition: max-height 0.2s ease; }
  .trace-panel.collapsed { max-height: 0; }
  .trace-panel.expanded { max-height: 600px; }
  .trace-content { padding: 12px 16px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.5; color: #e0e0e0; white-space: pre-wrap; word-break: break-word; overflow-y: auto; max-height: 580px; }
  .trace-content .trace-error { color: #f87171; }
  .trace-content .trace-label { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
  .trace-content .trace-section { margin-bottom: 12px; }
  .trace-content .trace-section:last-child { margin-bottom: 0; }
  .verdict-col { font-size: 12px; font-weight: 600; }
  .verdict-col.supported { color: #22c55e; }
  .verdict-col.refuted { color: #f87171; }
  .verdict-col.inconclusive { color: #f59e0b; }
  .verdict-col.error { color: #ef4444; }
  .duration { color: #666; font-size: 11px; font-family: monospace; }
  .stage-info { font-size: 11px; color: #888; font-style: italic; }
  .stage-info .stage-name { color: #60a5fa; }
  .stage-info .stage-attempt { color: #a78bfa; }
  .stage-info .stage-error { color: #f87171; }
  .sse-status { font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-left: 8px; }
  .sse-status.live { background: #1a2e1a; color: #4ade80; }
  .sse-status.disconnected { background: #3a1a1a; color: #f87171; }

  /* Console log panel */
  .console-header { display: flex; align-items: center; gap: 10px; margin-top: 20px; margin-bottom: 8px; }
  .console-header h2 { font-size: 14px; font-weight: 600; color: #999; }
  .console-header .console-controls { margin-left: auto; display: flex; gap: 6px; }
  .console-panel { background: #111; border: 1px solid #1a1a1a; border-radius: 6px; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 11px; line-height: 1.6; height: 240px; overflow-y: auto; overflow-x: hidden; padding: 8px 0; }
  .console-panel.collapsed { height: 0; padding: 0; border: none; }
  .log-line { padding: 1px 12px; display: flex; gap: 8px; border-left: 2px solid transparent; }
  .log-line:hover { background: #161616; }
  .log-line.info { border-left-color: #334155; }
  .log-line.warn { border-left-color: #a16207; }
  .log-line.error { border-left-color: #991b1b; }
  .log-line.success { border-left-color: #166534; }
  .log-ts { color: #444; flex-shrink: 0; white-space: nowrap; }
  .log-event { color: #60a5fa; flex-shrink: 0; min-width: 90px; }
  .log-msg { color: #bbb; word-break: break-word; }
  .log-line.warn .log-msg { color: #fbbf24; }
  .log-line.error .log-msg { color: #f87171; }
  .log-line.success .log-msg { color: #4ade80; }
  .log-detail { color: #555; font-size: 10px; }
  .console-count { font-size: 10px; color: #555; font-weight: 400; }
</style>
</head>
<body>

<h1>
  <span class="dot" id="health-dot"></span>
  <span id="lab-name">Lab Queue</span>
  <span class="sse-status disconnected" id="sse-status">connecting</span>
  <span class="refresh" id="refresh-btn">&#8635; refresh</span>
</h1>

<div class="stats" id="stats"></div>

<div class="tabs">
  <button class="tab active" data-filter="active">Active</button>
  <button class="tab" data-filter="all">All</button>
  <button class="tab" data-filter="completed">Completed</button>
  <button class="tab" data-filter="failed">Failed</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Type</th>
      <th>Hypothesis</th>
      <th>Status</th>
      <th>Verdict</th>
      <th>Error</th>
      <th>Started</th>
      <th>Duration</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="jobs"></tbody>
</table>

<div class="console-header">
  <h2>Console <span class="console-count" id="log-count"></span></h2>
  <div class="console-controls">
    <button class="btn" id="console-toggle">collapse</button>
    <button class="btn" id="console-clear">clear</button>
  </div>
</div>
<div class="console-panel" id="console-panel"></div>

<script>
const BASE = window.location.origin;
let currentFilter = 'active';
let allJobs = [];
const expandedTraces = new Set();
const traceCache = {};
const jobStages = {};

async function fetchJson(path) {
  const r = await fetch(BASE + path);
  return r.json();
}

// ── SSE ──────────────────────────────────────────────────────────────────
let evtSource = null;
function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource(BASE + '/events');
  const badge = document.getElementById('sse-status');

  evtSource.addEventListener('connected', (e) => {
    badge.textContent = 'live';
    badge.className = 'sse-status live';
    const data = JSON.parse(e.data);
    if (data.service) {
      document.getElementById('lab-name').textContent = data.service + ' Queue';
      document.title = data.service + ' Queue';
    }
    logConsole('info', 'connected', `SSE connected to ${data.service || 'lab'}`);
  });

  evtSource.addEventListener('job:queued', (e) => {
    const d = JSON.parse(e.data);
    jobStages[d.jobId] = { stage: 'queued' };
    logConsole('info', 'queued', `${d.jobId.slice(0,8)} queued — ${d.specType || '?'}`, d.hypothesis);
    refreshSmart();
  });

  evtSource.addEventListener('job:started', (e) => {
    const d = JSON.parse(e.data);
    jobStages[d.jobId] = { stage: 'starting', specType: d.specType };
    logConsole('info', 'started', `${d.jobId.slice(0,8)} started — ${d.specType || '?'}`);
    updateJobInPlace(d.jobId, { status: 'running' });
  });

  evtSource.addEventListener('job:stage', (e) => {
    const d = JSON.parse(e.data);
    jobStages[d.jobId] = d;
    const stageLabel = STAGE_LABELS[d.stage] || d.stage;
    const attempt = d.attempt ? ` (attempt ${d.attempt}/${d.maxAttempts})` : '';
    const level = (d.stage.includes('failed')) ? 'warn' : 'info';
    logConsole(level, d.stage, `${d.jobId.slice(0,8)} ${stageLabel}${attempt}`, d.error);
    renderJobs();
  });

  evtSource.addEventListener('job:finished', (e) => {
    const d = JSON.parse(e.data);
    delete jobStages[d.jobId];
    const dur = d.executionTimeMs ? formatDuration(d.executionTimeMs) : '';
    const conf = d.confidence != null ? ` ${(d.confidence * 100).toFixed(0)}%` : '';
    const level = d.status === 'failed' ? 'error' : (d.verdict === 'supported' ? 'success' : d.verdict === 'refuted' ? 'warn' : 'info');
    logConsole(level, 'finished', `${d.jobId.slice(0,8)} ${d.verdict || d.status}${conf} ${dur}`, d.error);
    updateJobInPlace(d.jobId, { status: d.status, verdict: d.verdict, confidence: d.confidence, error: d.error, executionTimeMs: d.executionTimeMs });
    refreshHealth();
  });

  evtSource.onerror = () => {
    badge.textContent = 'disconnected';
    badge.className = 'sse-status disconnected';
    logConsole('error', 'sse', 'SSE disconnected — will reconnect');
  };
}

function updateJobInPlace(jobId, updates) {
  const job = allJobs.find(j => j.id === jobId);
  if (job) {
    Object.assign(job, updates);
    renderJobs();
  } else {
    refreshSmart();
  }
}

// ── Data fetching ────────────────────────────────────────────────────────
let lastHealthStatus = null;
async function refreshHealth() {
  try {
    const health = await fetchJson('/health');
    const status = health.status === 'ok' ? 'ok' : 'err';
    document.getElementById('health-dot').className = 'dot ' + status;
    document.getElementById('stats').innerHTML = `
      <span>Queue: ${health.queueDepth}</span>
      <span>Running: ${health.running}</span>
      <span>Avg: ${health.avgExecutionMs > 0 ? Math.round(health.avgExecutionMs / 1000) + 's' : '\u2014'}</span>
      <span>Uptime: ${Math.round(health.uptime / 60)}m</span>
      <span>DB: ${health.db || '?'}</span>
    `;
    if (lastHealthStatus === 'err' && status === 'ok') {
      logConsole('success', 'health', 'Lab server is back online');
    } else if (lastHealthStatus === null) {
      logConsole('info', 'health', `Connected — queue: ${health.queueDepth}, running: ${health.running}, uptime: ${Math.round(health.uptime / 60)}m`);
    }
    lastHealthStatus = status;
    // Log when queue is idle
    if (health.queueDepth === 0 && health.running === 0 && lastHealthStatus !== 'idle') {
      // Don't spam — only log idle transition
    }
  } catch {
    document.getElementById('health-dot').className = 'dot err';
    if (lastHealthStatus !== 'err') {
      logConsole('error', 'health', 'Lab server unreachable');
    }
    lastHealthStatus = 'err';
  }
}

async function refreshSmart() {
  try {
    const [jobsRes] = await Promise.all([fetch(BASE + '/jobs'), refreshHealth()]);
    if (jobsRes.ok) {
      allJobs = await jobsRes.json();
      renderJobs();
    }
  } catch {
    document.getElementById('health-dot').className = 'dot err';
  }
}

// ── Rendering ────────────────────────────────────────────────────────────
const STAGE_LABELS = {
  queued: 'queued',
  starting: 'starting...',
  codegen: 'generating code',
  codegen_failed: 'codegen failed, retrying',
  executing: 'running experiment',
  exec_failed: 'execution failed, retrying',
  evaluating: 'evaluating results',
};

function renderJobs() {
  const tbody = document.getElementById('jobs');
  let filtered = allJobs;
  if (currentFilter === 'active') filtered = allJobs.filter(j => j.status === 'queued' || j.status === 'running');
  else if (currentFilter !== 'all') filtered = allJobs.filter(j => j.status === currentFilter);

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No jobs</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(j => {
    const spec = j.spec ? (typeof j.spec === 'string' ? JSON.parse(j.spec) : j.spec) : null;
    const specType = spec?.specType || '\u2014';
    const hypothesis = spec?.hypothesis || '\u2014';
    const started = j.started_at || j.startedAt || '';
    const completed = j.completed_at || j.completedAt || '';
    const startedStr = started ? formatDateTime(started) : (j.status === 'queued' ? 'queued' : '\u2014');
    const canCancel = j.status === 'queued' || j.status === 'running';
    const hasError = j.error && j.status === 'failed';
    const isExpanded = expandedTraces.has(j.id);
    const confidence = j.confidence != null ? j.confidence : null;
    const verdict = j.verdict || '\u2014';
    const verdictClass = j.verdict ? j.verdict : '';
    const verdictDisplay = j.verdict ? (confidence != null ? `${j.verdict} <span style="opacity:0.6;font-weight:400">${(confidence * 100).toFixed(0)}%</span>` : j.verdict) : '\u2014';
    const duration = j.executionTimeMs ? formatDuration(j.executionTimeMs) : (started && !completed && j.status === 'running' ? formatDuration(Date.now() - new Date(started + 'Z').getTime()) + '\u2026' : '\u2014');
    const errorPreview = hasError ? j.error.split('\n').pop() || j.error : '';

    // Live stage info for running jobs
    const stage = jobStages[j.id];
    let stageHtml = '';
    if (stage && j.status === 'running') {
      const label = STAGE_LABELS[stage.stage] || stage.stage;
      const attempt = stage.attempt ? ` <span class="stage-attempt">${stage.attempt}/${stage.maxAttempts}</span>` : '';
      const err = stage.error ? ` <span class="stage-error">${esc(stage.error.slice(0, 50))}</span>` : '';
      stageHtml = `<br><span class="stage-info"><span class="stage-name">${label}</span>${attempt}${err}</span>`;
    }

    let rows = `<tr class="job-row">
      <td class="job-id" title="${j.id}">${j.id.slice(0, 8)}</td>
      <td class="spec-type">${esc(specType)}</td>
      <td class="hypothesis" title="${esc(hypothesis)}">${esc(hypothesis.slice(0, 60))}</td>
      <td><span class="status ${j.status}">${j.status}</span>${stageHtml}</td>
      <td class="verdict-col ${verdictClass}">${verdictDisplay}</td>
      <td>${hasError ? `<span class="error-summary" onclick="toggleTrace('${j.id}')" title="${esc(j.error)}">${esc(errorPreview.slice(0, 60))}</span>` : '\u2014'}</td>
      <td class="time" title="${started ? new Date(started + 'Z').toLocaleString() : ''}">${startedStr}</td>
      <td class="duration">${duration}</td>
      <td class="actions">
        ${canCancel ? `<button class="btn danger" onclick="cancelJob('${j.id}')">&#10005;</button>` : ''}
        ${hasError ? `<button class="btn" onclick="toggleTrace('${j.id}')">${isExpanded ? 'hide' : 'trace'}</button>` : ''}
        ${j.status === 'completed' || j.status === 'failed' ? `<button class="btn" onclick="viewResult('${j.id}')">view</button>` : ''}
      </td>
    </tr>`;

    if (hasError) {
      const cached = traceCache[j.id];
      const traceHtml = cached ? formatTrace(cached) : (isExpanded ? '<span style="color:#666">Loading...</span>' : '');
      rows += `<tr class="trace-row"><td colspan="9"><div class="trace-panel ${isExpanded ? 'expanded' : 'collapsed'}"><div class="trace-content" id="trace-${j.id}">${traceHtml}</div></div></td></tr>`;
    }

    return rows;
  }).join('');

  for (const id of expandedTraces) {
    if (!traceCache[id]) loadTrace(id);
  }
}

function formatDuration(ms) {
  if (ms < 0) return '\u2014';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  const m = Math.floor(ms / 60000);
  const s = Math.round((ms % 60000) / 1000);
  if (m < 60) return m + 'm ' + s + 's';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function formatDateTime(isoStr) {
  if (!isoStr) return '\u2014';
  const d = new Date(isoStr.endsWith('Z') ? isoStr : isoStr + 'Z');
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (isToday) return time;
  const date = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return date + ' ' + time;
}

function formatTrace(trace) {
  let html = '';
  if (trace.error) {
    html += `<div class="trace-section"><span class="trace-label">Error</span><span class="trace-error">${esc(trace.error)}</span></div>`;
  }
  if (trace.stderr) {
    html += `<div class="trace-section"><span class="trace-label">stderr</span>${esc(trace.stderr)}</div>`;
  }
  if (trace.stdout) {
    html += `<div class="trace-section"><span class="trace-label">stdout</span>${esc(trace.stdout)}</div>`;
  }
  if (trace.meta) {
    html += `<div class="trace-section"><span class="trace-label">Execution Meta</span>${esc(trace.meta)}</div>`;
  }
  return html || '<span style="color:#666">No trace data available</span>';
}

async function loadTrace(id) {
  const trace = {};
  const job = allJobs.find(j => j.id === id);
  if (job?.error) trace.error = job.error;
  const fetches = [
    fetch(BASE + '/artifacts/' + id + '/stderr.txt').then(r => r.ok ? r.text() : null).then(t => { if (t && t !== '(empty)') trace.stderr = t; }).catch(() => {}),
    fetch(BASE + '/artifacts/' + id + '/stdout.txt').then(r => r.ok ? r.text() : null).then(t => { if (t && t !== '(empty)') trace.stdout = t; }).catch(() => {}),
    fetch(BASE + '/artifacts/' + id + '/execution_meta.json').then(r => r.ok ? r.text() : null).then(t => { if (t) trace.meta = t; }).catch(() => {}),
  ];
  await Promise.all(fetches);
  traceCache[id] = trace;
  const el = document.getElementById('trace-' + id);
  if (el) el.innerHTML = formatTrace(trace);
}

function toggleTrace(id) {
  if (expandedTraces.has(id)) {
    expandedTraces.delete(id);
  } else {
    expandedTraces.add(id);
  }
  renderJobs();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function cancelJob(id) {
  if (!confirm('Cancel this job?')) return;
  try {
    await fetch(BASE + '/jobs/' + id + '/cancel', { method: 'POST' });
    setTimeout(refreshSmart, 300);
  } catch(e) { alert('Failed: ' + e.message); }
}

function viewResult(id) {
  window.open(BASE + '/result/' + id, '_blank');
}

// ── Console log ─────────────────────────────────────────────────────────
const MAX_LOG_LINES = 500;
let logCount = 0;

function logConsole(level, event, message, detail) {
  const panel = document.getElementById('console-panel');
  if (!panel || panel.classList.contains('collapsed')) {
    // Still count even when collapsed
    logCount++;
    updateLogCount();
    // Buffer the line for when panel re-opens
    appendLogLine(panel, level, event, message, detail);
    return;
  }
  appendLogLine(panel, level, event, message, detail);
  logCount++;
  updateLogCount();
}

function appendLogLine(panel, level, event, message, detail) {
  if (!panel) return;
  const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const line = document.createElement('div');
  line.className = `log-line ${level}`;
  let html = `<span class="log-ts">${ts}</span><span class="log-event">${esc(event)}</span><span class="log-msg">${esc(message)}</span>`;
  if (detail) html += ` <span class="log-detail">${esc(String(detail).slice(0, 120))}</span>`;
  line.innerHTML = html;
  panel.appendChild(line);
  // Trim old lines
  while (panel.children.length > MAX_LOG_LINES) panel.removeChild(panel.firstChild);
  // Auto-scroll if near bottom
  if (panel.scrollHeight - panel.scrollTop - panel.clientHeight < 60) {
    panel.scrollTop = panel.scrollHeight;
  }
}

function updateLogCount() {
  const el = document.getElementById('log-count');
  if (el) el.textContent = logCount > 0 ? `(${logCount})` : '';
}

// Console controls
document.getElementById('console-toggle').addEventListener('click', () => {
  const panel = document.getElementById('console-panel');
  const btn = document.getElementById('console-toggle');
  panel.classList.toggle('collapsed');
  btn.textContent = panel.classList.contains('collapsed') ? 'expand' : 'collapse';
});
document.getElementById('console-clear').addEventListener('click', () => {
  document.getElementById('console-panel').innerHTML = '';
  logCount = 0;
  updateLogCount();
});

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderJobs();
  });
});

document.getElementById('refresh-btn').addEventListener('click', refreshSmart);

// ── Init ─────────────────────────────────────────────────────────────────
refreshSmart();
connectSSE();
// Fallback poll at 30s in case SSE drops
setInterval(refreshSmart, 30000);
</script>
</body>
</html>
